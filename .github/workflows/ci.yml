name: native checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg curl libsndfile1
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m mypy framenote
      - name: Distribution checks outside the checkout
        if: matrix.python == '3.12'
        env:
          FRAMENOTE_RUN_PACKAGING: '1'
          FRAMENOTE_WHEELHOUSE: ${{ runner.temp }}/framenote-wheels
        run: |
          mkdir -p "$FRAMENOTE_WHEELHOUSE"
          python -m pip download --dest "$FRAMENOTE_WHEELHOUSE" .
          python -m pytest tests/test_distribution.py -q
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.12' && success()
        with:
          name: framenote-distributions
          path: dist/*
